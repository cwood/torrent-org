version: 2

builds:
  - main: ./cmd/torrent-org
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, packaging/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
