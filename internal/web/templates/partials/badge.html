{{/* badge renders a rule as a coloured dot and its name, like the macOS client's groups; a nil rule is the default location. */}}
{{define "badge"}}{{if .}}<span class="badge" style="--rule: {{.Color}}"><span class="dot"></span>{{.Name}}</span>{{else}}<span class="badge muted"><span class="dot none"></span>Default</span>{{end}}{{end}}
